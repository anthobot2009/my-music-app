name: Build Private Music App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Create Project Files
      run: |
        flutter create --org com.private.downloader --template=app .
        rm pubspec.yaml
        cat << 'EOF' > pubspec.yaml
        name: youtube_music_app
        description: A new Flutter project.
        publish_to: 'none'
        version: 1.0.0+1
        environment:
          sdk: '>=3.0.0 <4.0.0'
        dependencies:
          flutter:
            sdk: flutter
          youtube_explode_dart: ^2.3.0
          just_audio: ^0.9.40
          path_provider: ^2.1.2
        flutter:
          uses-material-design: true
        EOF
        
    - name: Install Dependencies
      run: flutter pub get
      
    - name: Build Unsigned iOS App
      run: flutter build ipa --no-codesign
      
    - name: Upload Finished App
      uses: actions/upload-artifact@v3
      with:
        name: ios-app
        path: build/ios/ipa/*.ipa
